<!DOCTYPE html>
<html>
<head>
<title>Home Flight Radar</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial;
  background: #111;
  color: white;
  text-align: center;
}

.card {
  background: #222;
  margin: 15px;
  padding: 15px;
  border-radius: 15px;
}
</style>

</head>

<body>

<h1>✈ My Flight Radar</h1>

<p id="status">Loading...</p>

<div id="flights"></div>

<script>

const latitude = 18.48;   // change later
const longitude = 73.87;  // change later


async function getFlights(){

document.getElementById("status").innerHTML =
"Scanning sky...";

let url =
`https://opensky-network.org/api/states/all?lamin=${latitude-0.1}&lomin=${longitude-0.1}&lamax=${latitude+0.1}&lomax=${longitude+0.1}`;


let response = await fetch(url);

let data = await response.json();


let box=document.getElementById("flights");

box.innerHTML="";


if(!data.states){
box.innerHTML="No aircraft found";
return;
}


data.states.forEach(plane=>{

let callsign = plane[1];

let altitude = plane[7];


box.innerHTML += `

<div class="card">

<h2>${callsign || "Unknown"}</h2>

Altitude:
${altitude ? Math.round(altitude*3.28) : "?"} ft

</div>

`;

});


document.getElementById("status").innerHTML =
"Updated";

}


getFlights();

setInterval(getFlights,30000);


</script>

</body>
</html>
